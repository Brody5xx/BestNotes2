# 🛠️ Construye Best Notes 2 (APK) gratis en GitHub.
# El APK queda siempre en: https://github.com/Brody5xx/BestNotes2/releases/download/ultima-version/BestNotes2.apk
name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Probar y construir el APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk BestNotes2.apk

      - name: Publicar en el enlace fijo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          sleep 3
          gh release create ultima-version BestNotes2.apk \
            --title "Best Notes 2 (build ${GITHUB_RUN_NUMBER})" \
            --notes "Construido automáticamente. Descarga BestNotes2.apk e instálalo encima del anterior." \
            --target "${GITHUB_SHA}"

      - name: Publicar el registro de errores (si falló)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete registro-error --yes --cleanup-tag || true
          sleep 2
          tail -c 200000 build.log > registro-error.txt || echo "sin registro" > registro-error.txt
          gh release create registro-error registro-error.txt --title "Registro de error" --notes "Error de construcción" --target "${GITHUB_SHA}" --prerelease
